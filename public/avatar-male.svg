<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D2996F" />
      <stop offset="100%" stop-color="#BF8256" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242120" />
      <stop offset="100%" stop-color="#151413" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
  </defs>

  <!-- Circular Base -->
  <circle cx="100" cy="100" r="98" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
  
  <g clip-path="url(#circleClip)">
    <!-- Background -->
    <rect width="200" height="200" fill="url(#bgGrad)" />
    <circle cx="100" cy="80" r="75" fill="#38BDF8" opacity="0.12" />

    <!-- Shoulders & Torso -->
    <path d="M25 210 L35 160 Q65 142 100 142 Q135 142 165 160 L175 210 Z" fill="url(#shirtGrad)" />
    
    <!-- Collar Detail (Polo Style) -->
    <path d="M78 144 L100 172 L122 144 Q100 148 78 144 Z" fill="#0A0F1D" />
    <path d="M85 144 L100 166 L115 144 Z" fill="#1E293B" />
    <!-- Cyan Polo Trim Accent -->
    <line x1="100" y1="166" x2="100" y2="190" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M82 110 L82 146 Q100 152 118 146 L118 110 Z" fill="#B3774D" />
    <path d="M86 112 L86 142 Q100 146 114 142 L114 112 Z" fill="url(#skinGrad)" />

    <!-- Ears -->
    <ellipse cx="58" cy="102" rx="9" ry="14" fill="#BF8256" />
    <ellipse cx="58" cy="102" rx="5" ry="8" fill="#A86B42" />
    
    <ellipse cx="142" cy="102" rx="9" ry="14" fill="#BF8256" />
    <ellipse cx="142" cy="102" rx="5" ry="8" fill="#A86B42" />

    <!-- Head / Face Shape -->
    <path d="M64 80 Q64 42 100 42 Q136 42 136 80 Q136 122 100 134 Q64 122 64 80 Z" fill="url(#skinGrad)" />

    <!-- Beard / Trimmed Stubble -->
    <path d="M68 96 Q68 126 100 136 Q132 126 132 96 Q128 120 100 128 Q72 120 68 96 Z" fill="#201D1C" opacity="0.45" />
    <path d="M86 118 Q100 122 114 118 Q100 126 86 118 Z" fill="#1C1A19" opacity="0.35" />

    <!-- Hair (Back/Volume) -->
    <path d="M58 76 Q56 32 100 28 Q144 32 142 76 Q130 52 100 48 Q68 52 58 76 Z" fill="url(#hairGrad)" />
    <!-- Hair Texture Waves -->
    <path d="M62 62 Q78 36 108 34 Q132 36 138 58 Q124 44 98 44 Q76 46 62 62 Z" fill="#322E2C" />

    <!-- Eyebrows (Defined Indian Facial Features) -->
    <path d="M73 78 Q83 74 92 77" stroke="#1D1B1A" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M108 77 Q117 74 127 78" stroke="#1D1B1A" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Eyes -->
    <ellipse cx="83" cy="88" rx="6" ry="4" fill="#FFFFFF" />
    <circle cx="83" cy="88" r="3.2" fill="#231F1D" />
    <circle cx="84" cy="87" r="1.1" fill="#FFFFFF" />

    <ellipse cx="117" cy="88" rx="6" ry="4" fill="#FFFFFF" />
    <circle cx="117" cy="88" r="3.2" fill="#231F1D" />
    <circle cx="118" cy="87" r="1.1" fill="#FFFFFF" />

    <!-- Nose -->
    <path d="M99 82 L97 99 Q100 102 103 99 L101 82" stroke="#B07348" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Mustache (Subtle Groomed Trim) -->
    <path d="M87 110 Q100 113 113 110 Q100 116 87 110 Z" fill="#201D1C" opacity="0.6" />

    <!-- Mouth & Warm Smile -->
    <path d="M88 114 Q100 123 112 114" stroke="#874732" stroke-width="2.8" stroke-linecap="round" fill="none" />

    <!-- Eyeglasses (Smart Modern Maker Style) -->
    <rect x="71" y="80" width="24" height="17" rx="5" fill="none" stroke="#0F172A" stroke-width="2.2" />
    <rect x="105" y="80" width="24" height="17" rx="5" fill="none" stroke="#0F172A" stroke-width="2.2" />
    <line x1="95" y1="87" x2="105" y2="87" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" />
    <line x1="60" y1="86" x2="71" y2="86" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
    <line x1="129" y1="86" x2="140" y2="86" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
    <!-- Glass Lens Reflections -->
    <path d="M74 83 L83 83" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
    <path d="M108 83 L117 83" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>
