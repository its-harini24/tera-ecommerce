    <ellipse cx="60" cy="100" rx="4" ry="7" fill="#A86E45" />
    <!-- Cyan Stud Earring Left -->
    <circle cx="58" cy="108" r="3" fill="#0F172A" />
    <circle cx="58" cy="108" r="2" fill="#38BDF8" />
    <circle cx="57.5" cy="107.5" r="0.7" fill="#FFFFFF" />
    
    <ellipse cx="140" cy="100" rx="7" ry="12" fill="#C28759" />
    <ellipse cx="140" cy="100" rx="4" ry="7" fill="#A86E45" />
    <!-- Cyan Stud Earring Right -->
    <circle cx="142" cy="108" r="3" fill="#0F172A" />
    <circle cx="142" cy="108" r="2" fill="#38BDF8" />
    <circle cx="141.5" cy="107.5" r="0.7" fill="#FFFFFF" />

    <!-- Face Shape (Soft Contoured Chin) -->
    <path d="M66 78 Q66 44 100 44 Q134 44 134 78 Q134 118 100 132 Q66 118 66 78 Z" fill="url(#skinGradF)" />

    <!-- Hair Front Framing & Parting -->
    <path d="M54 74 Q52 32 100 28 Q148 32 146 74 Q136 50 108 44 Q76 44 62 68 Z" fill="url(#hairGradF)" />
