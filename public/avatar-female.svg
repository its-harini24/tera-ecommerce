    <path d="M107 75 Q116 71 126 76" stroke="#1D1B1A" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Eyes (Warm & Almond Shaped) -->
    <ellipse cx="84" cy="86" rx="6.5" ry="4.2" fill="#FFFFFF" />
    <circle cx="84" cy="86" r="3.2" fill="#231F1D" />
    <circle cx="85" cy="85" r="1.1" fill="#FFFFFF" />
    <!-- Eyelash Line Left -->
    <path d="M77 86 Q84 82 91 86" stroke="#181514" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M90 85 L93 83" stroke="#181514" stroke-width="1.5" stroke-linecap="round" />

    <ellipse cx="116" cy="86" rx="6.5" ry="4.2" fill="#FFFFFF" />
    <circle cx="116" cy="86" r="3.2" fill="#231F1D" />
    <circle cx="117" cy="85" r="1.1" fill="#FFFFFF" />
    <!-- Eyelash Line Right -->
    <path d="M109 86 Q116 82 123 86" stroke="#181514" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M122 85 L125 83" stroke="#181514" stroke-width="1.5" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M99 82 L98 97 Q100 100 102 97 L101 82" stroke="#B07348" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Blush Cheeks -->
    <ellipse cx="74" cy="98" rx="8" ry="4.5" fill="#E07A5F" opacity="0.22" />
    <ellipse cx="126" cy="98" rx="8" ry="4.5" fill="#E07A5F" opacity="0.22" />

    <!-- Lips (Warm Rose Smile) -->
    <path d="M88 112 Q94 109 100 111 Q106 109 112 112 Q100 122 88 112 Z" fill="#B85D43" />
    <path d="M90 112 Q100 114 110 112" stroke="#873523" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M94 112 Q100 116 106 112" fill="#E58B73" opacity="0.6" />

    <!-- Optional Smart Glasses (Modern Tech Professional) -->
    <rect x="72" y="78" width="23" height="16" rx="5" fill="none" stroke="#0F172A" stroke-width="1.8" />
    <rect x="105" y="78" width="23" height="16" rx="5" fill="none" stroke="#0F172A" stroke-width="1.8" />
    <line x1="95" y1="84" x2="105" y2="84" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" />
    <line x1="62" y1="83" x2="72" y2="83" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" />
    <line x1="128" y1="83" x2="138" y2="83" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" />
    <!-- Lens Highlight -->
    <path d="M75 81 L82 81" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.75" />
    <path d="M108 81 L115 81" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.75" />
