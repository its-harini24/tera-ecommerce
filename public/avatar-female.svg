<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="skinGradF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9A075" />
      <stop offset="100%" stop-color="#C28759" />
    </linearGradient>
    <linearGradient id="hairGradF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1C1B" />
      <stop offset="100%" stop-color="#11100F" />
    </linearGradient>
    <linearGradient id="topGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <clipPath id="circleClipF">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
  </defs>

  <!-- Circular Base -->
  <circle cx="100" cy="100" r="98" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
  
  <g clip-path="url(#circleClipF)">
    <!-- Background -->
    <rect width="200" height="200" fill="url(#bgGradF)" />
    <circle cx="100" cy="80" r="75" fill="#38BDF8" opacity="0.12" />

    <!-- Hair Back Volume -->
    <path d="M48 90 Q40 145 68 180 L132 180 Q160 145 152 90 Q150 40 100 32 Q50 40 48 90 Z" fill="url(#hairGradF)" />

    <!-- Shoulders & Torso (Smart Navy Blazer / Top) -->
    <path d="M28 210 L38 162 Q68 144 100 144 Q132 144 162 162 L172 210 Z" fill="url(#topGradF)" />
    
    <!-- Neckline & Collar with Cyan Accent -->
    <path d="M78 144 L100 178 L122 144 Z" fill="#0A0F1D" />
    <path d="M84 144 L100 172 L116 144 Z" fill="#0284C7" opacity="0.4" />
    <line x1="100" y1="172" x2="100" y2="198" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M84 112 L84 148 Q100 155 116 148 L116 112 Z" fill="#B5794E" />
    <path d="M87 114 L87 144 Q100 149 113 144 L113 114 Z" fill="url(#skinGradF)" />
    <!-- Collarbone Shadow -->
    <path d="M92 136 Q100 140 108 136" stroke="#A86E45" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Ears -->
